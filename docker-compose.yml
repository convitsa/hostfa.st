version: "3.9"

services:
  api:
    build: .
    container_name: hostfast_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - redis

  celery_worker:
    build: .
    container_name: hostfast_celery_worker
    command: celery -A app.tasks.celery_app.celery worker --loglevel=info -Q starter,pro,scale,default
    env_file:
      - .env
    depends_on:
      - redis

  celery_beat:
    build: .
    container_name: hostfast_celery_beat
    command: celery -A app.tasks.celery_app.celery beat --loglevel=info
    env_file:
      - .env
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: hostfast_redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
